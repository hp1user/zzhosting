<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game</title>

  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:#000; }
    .page { position:fixed; inset:0; display:grid; place-items:center; }
    .contain {
      width:  min(100dvw, calc(100dvh * 16/9));
      height: min(100dvh, calc(100dvw * 9/16));
      overflow:hidden;
    }
    iframe { width:100%; height:100%; border:0; display:block; }
  </style>

  <script>
    // iOS must avoid iframe for reliable fullscreen
    (function () {
      if (/iP(hone|ad|od)/.test(navigator.userAgent)) {
        // cache-bust once if needed by changing the value after v=
        location.replace('./player.html?iosfs=1&v=fs1');
      }
    })();
  </script>
</head>
<body>
  <div class="page">
    <div class="contain">
      <!-- Android/Desktop still use iframe -->
      <iframe src="./player.html?v=fs1" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
