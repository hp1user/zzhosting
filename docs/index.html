<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Unity Web Player | My project</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico" />
  <link rel="stylesheet" href="TemplateData/style.css" />

  <style>
    html,body { height:100%; margin:0; overflow:hidden; background:#000; }

    /* Top-level container (keeps Unity's template happy) */
    #unity-container {
      position:fixed; inset:0; display:grid; place-items:center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      background:#000;
    }

    /* Contain the game in 16:9 with no scrollbars */
    .fit16x9 {
      width:  min(100svw, calc(100svh * 16/9));
      height: min(100svh, calc(100svw * 9/16));
    }
    #unity-canvas { width:100% !important; height:100% !important; display:block; background:#231f20; }

    /* Ensure Unity's default loader stays visible and centered until hidden */
    #unity-loading-bar {
      position:fixed; inset:0;
      display:grid !important; place-items:center; z-index:1000;
      pointer-events:none; background:transparent;
    }

    /* Fullscreen toggle (works on iOS/Android/Desktop) */
    #fsToggle{
      position:fixed; right:12px; bottom:12px; z-index:50;
      padding:10px 14px; border:0; border-radius:12px; background:#1e1e1e; color:#fff;
      font:600 14px/1 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; opacity:.95;
    }
  </style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <div class="fit16x9">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <!-- Unity default loader UI -->
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">My project</div>
    </div>
  </div>

  <!-- Fullscreen toggle -->
  <button id="fsToggle" type="button" aria-label="Toggle fullscreen">Enter Fullscreen</button>

  <script>
    // Fullscreen toggle (top-level, so iOS works)
    (function setupFsToggle(){
      const btn = document.getElementById('fsToggle');
      const inFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
      const enterFS = async () => {
        const el = document.documentElement; // or document.getElementById('unity-canvas')
        try {
          if (el.requestFullscreen) await el.requestFullscreen();
          else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
        } catch(e) {}
      };
      const exitFS = async () => {
        try {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
        } catch(e) {}
      };
      const update = () => btn.textContent = inFS() ? 'Exit Fullscreen' : 'Enter Fullscreen';
      btn.addEventListener('click', () => inFS() ? exitFS() : enterFS());
      document.addEventListener('fullscreenchange', update);
      document.addEventListener('webkitfullscreenchange', update);
      update();
    })();

    // ---- Unity bootstrap (filenames must match your Build folder) ----
    const buildUrl  = "Build";
    const base      = "Medi"; // keep equal to your Unity Product Name
    const loaderUrl = `${buildUrl}/${base}.loader.js`;

    const config = {
      arguments: [],
      dataUrl:       `${buildUrl}/${base}.data`,
      frameworkUrl:  `${buildUrl}/${base}.framework.js`,
      codeUrl:       `${buildUrl}/${base}.wasm`,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "My project",
      productVersion: "0.1.0"
      // No DPR overrides to keep your previous iOS performance
    };

    function unityShowBanner(msg, type) {
      const warningBanner = document.querySelector("#unity-warning");
      function update() { warningBanner.style.display = warningBanner.children.length ? 'block' : 'none'; }
      const div = document.createElement('div'); div.innerHTML = msg; warningBanner.appendChild(div);
      if (type === 'error') div.style = 'background:red;padding:10px;';
      else { if (type === 'warning') div.style = 'background:yellow;padding:10px;'; setTimeout(() => { warningBanner.removeChild(div); update(); }, 5000); }
      update();
    }

    document.querySelector("#unity-loading-bar").style.display = "grid";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(document.querySelector("#unity-canvas"),
        { ...config, showBanner: unityShowBanner },
        (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = (progress * 100) + "%";
        }
      ).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => unityInstance.SetFullscreen(1);
      }).catch((message) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
