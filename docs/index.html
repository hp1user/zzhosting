<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game</title>
  <style>
    html,body { margin:0; height:100%; background:#000; overflow:hidden; }
    .page { position:fixed; inset:0; display:grid; place-items:center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .contain { width:min(100svw, calc(100svh*16/9));
               height:min(100svh, calc(100svw*9/16)); }
    iframe { width:100%; height:100%; border:0; display:block; }
  </style>
  <script>
    // === UPDATE THIS EACH DEPLOY (commit hash, date, build number, etc.) ===
    const BUILD_TAG = "r13-2025-11-28"; // e.g., use your short git SHA

    // If iOS (Safari/Chrome on iOS), skip iframe -> go straight to player.html
    (function () {
      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
      if (isIOS) {
        location.replace('./player.html?v=' + encodeURIComponent(BUILD_TAG));
      } else {
        // For Android/Desktop set iframe src with version param
        window.addEventListener('DOMContentLoaded', () => {
          document.getElementById('game').src =
            './player.html?v=' + encodeURIComponent(BUILD_TAG);
        });
      }
    })();
  </script>
</head>
<body>
  <div class="page">
    <div class="contain">
      <iframe id="game" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
