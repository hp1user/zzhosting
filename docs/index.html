<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game</title>
  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:#000; }
    .page { position:fixed; inset:0; display:grid; place-items:center; }
    .contain {
      width:min(100dvw, calc(100dvh * 16/9));
      height:min(100dvh, calc(100dvw * 9/16));
      overflow:hidden;
    }
    iframe { width:100%; height:100%; border:0; display:block; }

    /* iOS-only launcher */
    #openIOS {
      position:fixed; right:12px; bottom:12px; z-index:50; display:none;
      padding:10px 14px; border:0; border-radius:12px; background:#1e1e1e; color:#fff;
      font:600 14px/1 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; opacity:.95;
    }
    #iosTip {
      display:none; text-align:center; color:white; margin:12px; font-size:16px;
      position: fixed; left: 0; right: 0; bottom: 56px; z-index: 51;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="contain">
      <iframe id="game" src="./player.html?v=fsB1"
              allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </div>

  <!-- iOS: user chooses to open top page (no iframe) -->
  <div id="iosTip">For best experience on iPhone, tap below to open full page:</div>
  <button id="openIOS" type="button">Open in Full Page (iOS)</button>
  <script>
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
    if (isIOS) {
      document.getElementById('openIOS').style.display = 'block';
      document.getElementById('iosTip').style.display = 'block';
      document.getElementById('openIOS').onclick = () => {
        location.href = './player.html?iosfs=1&v=fsB1';
      };
    }
  </script>
</body>
</html>
