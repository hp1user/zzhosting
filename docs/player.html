<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Unity Web Player | My project</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html,body { height:100%; margin:0; overflow:hidden; background:#000; }
    #stage { position:fixed; inset:0; display:grid; place-items:center;
             padding: env(safe-area-inset-top) env(safe-area-inset-right)
                      env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .fit16x9 {
      width:  min(100dvw, calc(100dvh * 16/9));
      height: min(100dvh, calc(100dvw * 9/16));
    }
    #unity-canvas { width:100% !important; height:100% !important; display:block; background:#231f20; }

    /* Fullscreen toggle */
    #fsToggle{
      position:fixed; right:12px; bottom:12px; z-index:50;
      padding:10px 14px; border:0; border-radius:12px; background:#1e1e1e; color:#fff;
      font:600 14px/1 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; opacity:.95;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="fit16x9">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
  </div>

  <!-- Unity's default loader UI -->
  <div id="unity-loading-bar">
    <div id="unity-logo"></div>
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>
  <div id="unity-warning"></div>
  <div id="unity-footer">
    <div id="unity-logo-title-footer"></div>
    <div id="unity-fullscreen-button"></div>
    <div id="unity-build-title">My project</div>
  </div>

  <!-- Fullscreen toggle button -->
  <button id="fsToggle" type="button" aria-label="Toggle fullscreen">Enter Fullscreen</button>

  <script>
    // ---- Fullscreen toggle (works on iOS because this page is top-level there) ----
    (function setupFsToggle(){
      const btn = document.getElementById('fsToggle');

      function inFS() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }
      async function enterFS() {
        const el = document.documentElement; // or document.getElementById('unity-canvas')
        try {
          if (el.requestFullscreen) await el.requestFullscreen();
          else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
        } catch(e) {}
      }
      async function exitFS() {
        try {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
        } catch(e) {}
      }
      function updateBtn(){ btn.textContent = inFS() ? 'Exit Fullscreen' : 'Enter Fullscreen'; }

      btn.addEventListener('click', () => inFS() ? exitFS() : enterFS());
      document.addEventListener('fullscreenchange', updateBtn);
      document.addEventListener('webkitfullscreenchange', updateBtn);
      updateBtn();
    })();

    // ---- Unity bootstrap (names must match your Build folder) ----
    const buildUrl  = "Build";
    const base      = "Medi"; // keep equal to your Unity Product Name
    const loaderUrl = `${buildUrl}/${base}.loader.js`;

    const config = {
      arguments: [],
      dataUrl:       `${buildUrl}/${base}.data`,
      frameworkUrl:  `${buildUrl}/${base}.framework.js`,
      codeUrl:       `${buildUrl}/${base}.wasm`,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "My project",
      productVersion: "0.1.0"
      // No DPR overrides (keeps your earlier non-laggy iOS behavior)
    };

    function unityShowBanner(msg, type) {
      const warningBanner = document.querySelector("#unity-warning");
      function update() { warningBanner.style.display = warningBanner.children.length ? 'block' : 'none'; }
      const div = document.createElement('div'); div.innerHTML = msg; warningBanner.appendChild(div);
      if (type === 'error') div.style = 'background:red;padding:10px;';
      else { if (type === 'warning') div.style = 'background:yellow;padding:10px;'; setTimeout(() => { warningBanner.removeChild(div); update(); }, 5000); }
      update();
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(document.querySelector("#unity-canvas"), { ...config, showBanner: unityShowBanner }, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = (progress * 100) + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => unityInstance.SetFullscreen(1);
      }).catch((message) => { alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
